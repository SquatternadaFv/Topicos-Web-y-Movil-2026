<html lang="es">
<head><meta charset="utf-8"><title>Seguimiento {{ folio }}</title></head>
<body>

  <!-- "Mapa": un recuadro. No consulta la base; solo pinta lo que

              display:flex;align-items:center;justify-content:center;">
    Mapa (placeholder) — medio: {{ medio }}

</body>
</html>
