server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /pedidos { proxy_pass http://pedidos:8001; proxy_read_timeout 10s; }
    location = /salud/pedidos { proxy_pass http://pedidos:8001/salud; }
    location = /salud/recomendar { proxy_pass http://recomendar:8002/salud; }
    location / { try_files $uri $uri/ /index.html; }
}
